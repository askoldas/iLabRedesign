<aside class="cookie" data-cookie role="dialog" aria-labelledby="cookie-title" aria-live="polite">
  <p class="h3" id="cookie-title">{{t:cookie_title}}</p>
  <p class="small muted">{{t:cookie_text}}</p>
  <div class="cookie__btns">
    <button class="btn btn-secondary btn--sm" type="button" data-consent="rejected">{{t:cookie_reject}}</button>
    <button class="btn btn-primary btn--sm" type="button" data-consent="accepted">{{t:cookie_accept}}</button>
  </div>
</aside>
