<aside class="drawer counter" data-drawer="contact" role="dialog" aria-modal="true" aria-labelledby="contact-drawer-title" tabindex="-1">
  <i class="drawer__scan" aria-hidden="true"></i>
  <div class="drawer__inner">
    <div class="drawer__top"><h2 class="display-2" id="contact-drawer-title">{{t:drawer_contact_title}}</h2><button class="drawer__close" type="button" data-close aria-label="{{t:close}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div data-tabs>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-tab="domina" aria-selected="true">T/C Domina Shopping</button>
        <button class="tab" role="tab" type="button" data-tab="spice" aria-selected="false">T/C Spice Life</button>
      </div>
      <div data-panel="domina" class="is-active" role="tabpanel"><!-- @include partials/branch-domina.html --></div>
      <div data-panel="spice" role="tabpanel"><!-- @include partials/branch-spice.html --></div>
    </div>
    <p><button class="btn btn-primary" type="button" data-open="booking">{{t:book}}</button></p>
  </div>
</aside>
